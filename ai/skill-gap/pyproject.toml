# The skill-gap service (ADR-0003, ADR-0006 workspace member).
#
# **No runtime dependencies beyond the shared base.** The gap is arithmetic over facts supplied in
# the request (docs/features/skill-gap-analysis.md), so this service needs no document library, no
# model client, and no database driver. If that list ever grows, check first that the new dependency
# is not doing work `compute.py` should be doing.

[project]
name = "zentavio-skill-gap"
version = "0.0.0"
description = "Compare a profile against a target's requirements and produce an ordered, weighted gap."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.121.2",
  "pydantic==2.12.4",
  "uvicorn==0.38.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
