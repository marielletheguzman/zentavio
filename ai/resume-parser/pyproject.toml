# The résumé parser (ADR-0003, ADR-0006 workspace member).
#
# **No document-parsing dependency yet, deliberately.** ADR-0016 is Proposed, not Accepted, so
# `pypdf` and `python-docx` are not declared here. Text extraction sits behind a port
# (`src/ports.py`), and the only implementation today reads plain text — which is enough to build
# and test everything downstream of extraction.
#
# When ADR-0016 is Accepted, the libraries are added HERE and nowhere else. `ai/shared` must not
# accumulate its members' dependencies (ADR-0006).

[project]
name = "zentavio-resume-parser"
version = "0.0.0"
description = "Extract skills, roles, and experience from a résumé, with the source span for every claim."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
