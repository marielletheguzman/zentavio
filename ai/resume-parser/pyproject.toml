# The résumé parser (ADR-0003, ADR-0006 workspace member).
#
# Document parsing per ADR-0016: `pypdf` and `python-docx`, both behind the `TextExtractor` port in
# `src/ports.py`. Nothing outside `src/extract.py` may import them — that is what keeps a swap to
# `pdfplumber` a one-file change rather than a rewrite.
#
# Declared HERE and nowhere else: `ai/shared` must not accumulate its members' dependencies
# (ADR-0006). These are the only two runtime dependencies the résumé parser has.
#
# An uploaded document is hostile input (`docs/features/resume-parsing.md`), so these pins are
# updated deliberately rather than pinned and forgotten — a parser CVE is our CVE.

[project]
name = "zentavio-resume-parser"
version = "0.0.0"
description = "Extract skills, roles, and experience from a résumé, with the source span for every claim."
requires-python = ">=3.12"
dependencies = [
  # The ASGI server. FastAPI is a framework, not a process — without this the service
  # cannot start anywhere, which went unnoticed because every test drives it in-process
  # through TestClient.
  "uvicorn==0.38.0",
  "fastapi==0.121.2",
  "pydantic==2.12.4",
  "pypdf==6.1.3",
  "python-docx==1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
