name: CI

# Boundary enforcement is only real if it runs on every change (ADR-0005). This
# workflow is the "non-skippable lint job" that ADR's Compliance section names.
#
# Workflow files must live in .github/workflows/ — GitHub does not read them from
# anywhere else. The reusable pieces live in infra/ci/actions/, which is what
# `infra/ci` is for. See infra/ci/README.md and docs/development/ci-cd.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded run proves nothing. Cancel it and keep the queue short.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege: nothing in this workflow writes to the repository.
permissions:
  contents: read

jobs:
  # ── TypeScript: layers, contracts, banned dependencies ──────────────────────
  typescript:
    name: Lint and typecheck (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./infra/ci/actions/setup-node-pnpm
        with:
          node-version: '22'

      # eslint.config.mjs is the executable form of the layer model in
      # .claude/skills/architecture/SKILL.md. This step is what makes ADR-0001's
      # "boundaries are conventional" accepted cost survivable.
      - name: ESLint (layer boundaries, banned imports, process.env)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # ADR-0007: the fast project only. The integration project has its own job below,
      # because it needs a real PostgreSQL and a separate job means a separate,
      # legible failure signal.
      - name: Unit tests
        run: pnpm test:unit

      # eslint-plugin-boundaries can be silenced with an inline disable comment.
      # That hole is audited explicitly rather than trusted.
      - name: Audit suppressed boundary rules
        run: node tools/scripts/audit-boundary-disables.mjs

  # ── Integration: the schema against a real PostgreSQL ───────────────────────
  # docs/development/testing.md forbids mocking PostgreSQL, because what a CHECK
  # actually rejects and what a partial unique index actually permits is the whole
  # point of these tests — and neither is knowable from a fake.
  #
  # This job also applies every migration to an empty database on every run, which
  # is the state a fresh environment starts in and the one most likely to rot
  # unnoticed.
  integration:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        # Same tag as infra/docker/docker-compose.dev.yml, deliberately: a CI database
        # on a different major than the developer's would make a green run evidence
        # about the wrong server. Both should eventually be pinned by digest, and must
        # be changed together when they are.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: zentavio
          POSTGRES_PASSWORD: zentavio_ci
          # Created directly, unlike local development: this database is disposable and
          # there is nothing here for the suite to share with.
          POSTGRES_DB: zentavio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zentavio -d zentavio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      minio:
        # Same tag as infra/docker/docker-compose.dev.yml, for the same reason as postgres: a CI
        # object store on a different release than the developer's would make a green run evidence
        # about the wrong server. ADR-0021 requires both to speak the same S3 protocol production
        # will.
        image: minio/minio:RELEASE.2025-04-22T22-12-26Z
        env:
          MINIO_ROOT_USER: zentavio
          MINIO_ROOT_PASSWORD: zentavio_ci_secret
        ports:
          - 9000:9000
        options: >-
          --health-cmd "mc ready local"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./infra/ci/actions/setup-node-pnpm
        with:
          node-version: '22'

      - name: Integration tests
        env:
          # The name ends in _test, which tests/integration/db/database.ts requires before
          # it will drop a schema. The credential is disposable and lives only in this
          # ephemeral service container.
          ZENTAVIO_TEST_DATABASE_URL: postgres://zentavio:zentavio_ci@localhost:5432/zentavio_test
          # ADR-0021. The suite creates its own bucket per run, so nothing is provisioned here.
          # Credentials are disposable and live only in the ephemeral service container.
          ZENTAVIO_STORAGE_ENDPOINT: http://localhost:9000
          ZENTAVIO_STORAGE_BUCKET: zentavio-documents
          ZENTAVIO_STORAGE_ACCESS_KEY_ID: zentavio
          ZENTAVIO_STORAGE_SECRET_ACCESS_KEY: zentavio_ci_secret
        run: pnpm test:integration

  # ── Python: ai/ statelessness ───────────────────────────────────────────────
  # ESLint cannot see ai/ (ADR-0003 makes it Python), so the rules that keep the
  # AI layer stateless live in ruff.toml and run as their own job. A separate job
  # means a separate, legible failure signal.
  python:
    name: Lint (Python, ai/)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The promptVersion check diffs against the base, so a shallow clone is not
          # enough. Depth 0 is the simple correct answer; revisit if history grows large.
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # Matches target-version in ruff.toml. Linting for 3.12 while testing on
          # whichever interpreter the runner happened to ship would make the ai/ bans
          # evidence about a Python nobody runs.
          python-version: '3.12'

      - name: Install uv
        # Pinned exactly, like Ruff. ADR-0006 accepted a young tool in a load-bearing
        # position on one condition: an unpinned tool version makes the lockfile's
        # guarantee conditional on the machine.
        #
        # No third-party setup action — one pip install with an exact version is the
        # whole mechanism, for the same reason corepack replaces a pnpm setup action
        # in infra/ci/actions/setup-node-pnpm.
        run: pip install uv==0.9.6

      # ADR-0006 Compliance: a resolution that happens at install time is not
      # reproducible. This fails when ai/uv.lock has drifted from the pyproject.toml
      # files, which is a separate failure from a dependency that does not install.
      #
      # UV_FROZEN is deliberately NOT set job-wide: for `uv lock` it means
      # --check-exists, which conflicts with --check. Every other step passes --frozen
      # explicitly instead.
      - name: Lockfile is current
        run: uv lock --project ai --check

      # --all-packages is required and its absence is silent: without it uv installs the
      # workspace root, which declares no dependencies, and every service's runtime
      # dependency is simply missing. That is what `ModuleNotFoundError: No module named
      # 'docx'` looked like when this job installed from a hand-mirrored pip file.
      - name: Install the Python workspace
        run: uv sync --project ai --all-packages --frozen

      - name: Ruff (statelessness bans, lint)
        run: uv run --project ai --all-packages --frozen ruff check ai/

      - name: Ruff (format check)
        run: uv run --project ai --all-packages --frozen ruff format --check ai/

      # ADR-0007: pytest for the Python half. Configured by pytest.ini at the repository
      # root, which is still the only pytest configuration — `uv run` changes the
      # interpreter, not the working directory.
      - name: Python tests
        run: uv run --project ai --all-packages --frozen pytest

      # ADR-0009's one mechanisable piece: a prompt whose content changed without its
      # filename changing makes every output recorded against that promptVersion
      # unreproducible. On a pull request the base is the target branch; on a push to main
      # the script falls back to the previous commit.
      - name: promptVersion integrity
        run: |
          uv run --project ai --all-packages --frozen python ai/shared/evals/check_prompt_versions.py             ${{ github.event_name == 'pull_request' && format('--base {0}', github.event.pull_request.base.sha) || '' }}

      # Offline eval checks only: fixture integrity, that every prompt has all six
      # required case kinds, and that no prompt ships without fixtures. Graded runs need
      # an Ollama host, which this runner does not have — see docs/prompts/evals.md.
      # Exits 0 while zero prompts exist, so this is a real check that is currently a no-op.
      - name: Prompt eval fixture checks (offline)
        run: uv run --project ai --all-packages --frozen python ai/shared/evals/run_evals.py --offline

  # ── One required status check ───────────────────────────────────────────────
  # Branch protection points at this job alone, so adding a job above does not
  # require editing branch protection to make it blocking.
  ci:
    name: CI
    if: always()
    needs: [typescript, integration, python]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all checks passed
        run: |
          echo "typescript:  ${{ needs.typescript.result }}"
          echo "integration: ${{ needs.integration.result }}"
          echo "python:      ${{ needs.python.result }}"
          if [ "${{ needs.typescript.result }}" != "success" ] \
            || [ "${{ needs.integration.result }}" != "success" ] \
            || [ "${{ needs.python.result }}" != "success" ]; then
            echo "::error::One or more CI jobs failed. A boundary rule, type, schema, or lint check did not pass."
            exit 1
          fi
