# Local development services.
#
# PostgreSQL and MinIO. Redis and Qdrant are in the stack (`.claude/context/tech-stack.md`) but
# nothing reads them yet, and a service declared before its first reader is a service nobody
# verifies — the same rule `packages/config/src/zentavio.ts` applies to environment keys. MinIO
# arrives here only now, with `S3DocumentStore`, for exactly that reason.
#
# ADR-0021 requires development to exercise the **same S3 protocol** as production. A filesystem
# stub locally would mean the real client is first executed in production, which is how the gateway
# shipped with no CORS at all through M1c.
#
#   docker compose -f infra/docker/docker-compose.dev.yml up -d
#
# The credentials here are development-only and deliberately in the file rather than in an env
# var: this database is reachable from localhost only, holds no real data, and a developer who
# has to invent a password invents a different one on every machine.

services:
  postgres:
    image: postgres:17-alpine
    container_name: zentavio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zentavio
      POSTGRES_PASSWORD: zentavio_dev
      POSTGRES_DB: zentavio
      # Deterministic collation, so an ORDER BY here matches an ORDER BY in CI.
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=und-x-icu --encoding=UTF8'
    ports:
      - '5432:5432'
    volumes:
      - zentavio-pgdata:/var/lib/postgresql/data
      # Runs once, on an empty data directory only.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # `docker compose up --wait` blocks on this, so a migration run cannot race the boot.
      test: ['CMD-SHELL', 'pg_isready -U zentavio -d zentavio']
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    # S3-compatible object storage for local development (ADR-0021). Production is Cloudflare R2 —
    # same protocol, so `S3DocumentStore` and every test path are identical and only the endpoint
    # and credentials differ.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: zentavio-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: zentavio
      MINIO_ROOT_PASSWORD: zentavio_dev_secret
    ports:
      - '9000:9000'
      # Console, for looking at what was archived. No code uses it.
      - '9001:9001'
    volumes:
      - zentavio-miniodata:/data
    healthcheck:
      # `docker compose up --wait` blocks on this, so an ingest cannot race the boot.
      test: ['CMD-SHELL', 'mc ready local || exit 1']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  zentavio-pgdata:
  zentavio-miniodata:
