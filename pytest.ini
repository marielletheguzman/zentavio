; Pytest configuration for the Python half of the repository (ADR-0007).
;
; The eval runner's modules import each other flatly (`from cases import ...`) because
; run_evals.py is invoked as a script, so its directory goes on the path here rather than
; each test file patching sys.path.
;
; ADR-0006 note: the uv workspace now exists (ai/pyproject.toml, uv.lock committed), but this
; configuration deliberately stays here rather than moving into it. CI still invokes
; `python -m pytest` from the repository root, and two pytest configurations — one here, one in
; ai/pyproject.toml — would be a drift waiting to happen. It moves in the same change that
; switches ci.yml to `uv sync --frozen`, which needs a token with the `workflow` scope.

[pytest]
testpaths = ai
pythonpath = ai/shared/evals ai/resume-parser/src
python_files = test_*.py
addopts = -q --strict-markers --strict-config
