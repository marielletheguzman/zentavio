; Pytest configuration for the Python half of the repository (ADR-0007).
;
; The eval runner's modules import each other flatly (`from cases import ...`) because
; run_evals.py is invoked as a script, so its directory goes on the path here rather than
; each test file patching sys.path.
;
; ADR-0006 note: this configuration deliberately stays here rather than moving into
; ai/pyproject.toml. CI now runs `uv run --project ai --all-packages --frozen pytest`, which changes
; the interpreter and not the working directory, so pytest still discovers this file from the
; repository root. Two pytest configurations — one here, one in ai/pyproject.toml — would be a drift
; waiting to happen, and one at the root is what makes `testpaths = ai` mean what it says.

[pytest]
testpaths = ai
pythonpath = ai/shared/evals ai/resume-parser/src ai/resume-parser/tests
python_files = test_*.py
addopts = -q --strict-markers --strict-config
