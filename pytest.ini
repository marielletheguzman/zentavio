; Pytest configuration for the Python half of the repository (ADR-0007).
;
; The eval runner's modules import each other flatly (`from cases import ...`) because
; run_evals.py is invoked as a script, so its directory goes on the path here rather than
; each test file patching sys.path.
;
; **Every service's modules live in a package named after it** — `resume_parser`, `skill_gap` — and
; not as loose files on this path. Two services both exporting a top-level `compute` collide the
; moment the second one is written: pytest imports whichever directory came first and the second
; service's tests silently exercise the first service's code. The same collision exists in any
; environment where both wheels are installed, so this is a packaging rule rather than a test
; convenience.
;
; ADR-0006 note: this configuration deliberately stays here rather than moving into
; ai/pyproject.toml. CI now runs `uv run --project ai --all-packages --frozen pytest`, which changes
; the interpreter and not the working directory, so pytest still discovers this file from the
; repository root. Two pytest configurations — one here, one in ai/pyproject.toml — would be a drift
; waiting to happen, and one at the root is what makes `testpaths = ai` mean what it says.

[pytest]
testpaths = ai
pythonpath = ai/shared/evals ai/resume-parser/src ai/resume-parser/tests ai/skill-gap/src ai/career-roadmap/src
python_files = test_*.py
; importlib import mode so two services may both have a tests/test_compute.py. Under the legacy
; mode pytest keys test modules by basename and refuses the second one, which would force test
; filenames to encode which service they belong to rather than what they test.
addopts = -q --strict-markers --strict-config --import-mode=importlib
