; Pytest configuration for the Python half of the repository (ADR-0007).
;
; The eval runner's modules import each other flatly (`from cases import ...`) because
; run_evals.py is invoked as a script, so its directory goes on the path here rather than
; each test file patching sys.path.
;
; ADR-0006 note: when the first ai/ service exists, this moves into the uv workspace's
; pyproject.toml alongside the service's own dependencies. Until then it lives here, matching
; how Ruff is pinned in requirements-dev.txt.

[pytest]
testpaths = ai
pythonpath = ai/shared/evals
python_files = test_*.py
addopts = -q --strict-markers --strict-config
